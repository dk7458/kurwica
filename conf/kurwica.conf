

# Kurwica Configuration File

[general]
log_directory = /var/log/kurwica
tmp_directory = /tmp/kurwica

[pools]
# Define pools and their scrub intervals in hours (e.g., s00p=72, p01l=48)
# s00p = 72
# p01l = 48

[snapshots]
# Define snapshot intervals in hours (e.g., daily=24)
daily = 24
weekly = 168

[logging]
log_level = INFO
log_file = /var/log/kurwica/kurwica.log

